name: Feature request
description: Suggest a change to how PhotonRelic works
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation you are in, not the solution. What is awkward or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like instead?
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
      description: Workarounds, other tools, or configuration that almost does it.
