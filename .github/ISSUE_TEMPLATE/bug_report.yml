name: Bug report
description: Something does not work as the README says it should
labels: [bug]
body:
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options:
        - Resizer
        - Library
        - media-params package
        - prep-images.py
        - Deployment scripts
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead. Include the response status and any `x-media-transform` header if it is a resizer problem.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: |
        1. Set SERVED_PREFIXES to ...
        2. Request /media/...?w=...
        3. See ...
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0, or a commit sha
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: The `[vars]` you changed from the defaults. Leave out hostnames, ids and anything private.
      render: toml
