# Lint, typecheck and test every pull request and every push to master, and
# check that no private name slipped into the tree, the commit messages, or
# the pull request's title and description (which become the squash commit).
# Nothing here deploys: deployment needs account secrets and prints account
# details in its logs, which are public on this repo, so it lives elsewhere.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    # "edited" re-runs the scan when the title or description changes.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Corepack installs the pnpm version named in package.json, so the
      # workflow needs no third-party action and the repository's Actions
      # policy can stay at GitHub-owned and verified creators only. It runs
      # before setup-node, which looks for pnpm to set up the store cache.
      # Corepack ships with Node 22 to 24 only; when node-version moves past
      # 24, replace this with `npm install -g pnpm@<version in package.json>`.
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  names:
    name: Private names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The patterns are a repository secret, so they never appear in this
      # public file or in the logs. Only the names of offending files and the
      # hashes of offending commits are printed, never the matching text.
      # Pull requests from forks have no secrets and skip the scan.
      - name: Scan the tree, the commit messages and the pull request text
        env:
          FORBIDDEN_PATTERNS: ${{ secrets.FORBIDDEN_PATTERNS }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # Title and body reach the shell through the environment, never by
          # interpolation into the script, so their content cannot run.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$FORBIDDEN_PATTERNS" ]; then
            echo "No pattern secret available (fork pull request); scan skipped."
            exit 0
          fi
          status=0
          files=$(git ls-files -z \
            | grep -zvE '^pnpm-lock\.yaml$|\.woff2$' \
            | xargs -0 grep -IilE -e "$FORBIDDEN_PATTERNS" -- || true)
          if [ -n "$files" ]; then
            echo "::error::Private names found in:"
            printf '%s\n' "$files"
            status=1
          fi
          if [ -n "$BASE" ] && ! printf '%s' "$BASE" | grep -q '^0*$' && git cat-file -e "$BASE" 2>/dev/null; then
            range="$BASE..HEAD"
          else
            range="HEAD"
          fi
          bad=""
          for sha in $(git rev-list "$range"); do
            if git log -1 --format='%B' "$sha" | grep -qiE -e "$FORBIDDEN_PATTERNS"; then
              bad="$bad$sha"$'\n'
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error::Private names in the messages of these commits:"
            printf '%s' "$bad"
            status=1
          fi
          if [ -n "$PR_TITLE$PR_BODY" ] && printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -qiE -e "$FORBIDDEN_PATTERNS"; then
            echo "::error::Private names in the pull request title or description. Edit them before merging; a squash merge turns them into the commit message."
            status=1
          fi
          [ "$status" -eq 0 ] && echo "Clean."
          exit $status
