# Publishes a GitHub Release when a maintainer pushes a signed tag v*. It
# re-runs the checks on the tagged commit, confirms that the tag, every
# package.json and CHANGELOG.md agree (scripts/release-check.sh), then creates
# the release with that changelog section as its notes and scripts/install.sh
# attached. The default workflow token is enough: it needs contents: write to
# create a release, and nothing here deploys or reads account secrets. gh is
# preinstalled on the runner, so no third-party action is needed and the
# repository's Actions policy stays at GitHub-owned and verified creators.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Check and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A tag checkout brings no branches; the check needs master to confirm
      # that the tagged commit is on it.
      - run: git fetch origin +refs/heads/master:refs/remotes/origin/master
      # Corepack installs the pnpm version named in package.json; it ships
      # with Node 22 to 24. When node-version moves past 24, replace this with
      # `npm install -g pnpm@<version in package.json>`.
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - id: check
        run: sh scripts/release-check.sh "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.check.outputs.version }}
          PRERELEASE: ${{ steps.check.outputs.prerelease }}
          NOTES: ${{ steps.check.outputs.notes }}
        # A re-run after a transient failure updates the release it already
        # made instead of failing on it.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "PhotonRelic $VERSION" --notes-file "$NOTES"
            gh release upload "$TAG" scripts/install.sh --clobber
          else
            set -- --verify-tag --title "PhotonRelic $VERSION" --notes-file "$NOTES"
            [ "$PRERELEASE" != true ] || set -- "$@" --prerelease
            gh release create "$TAG" scripts/install.sh "$@"
          fi
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
