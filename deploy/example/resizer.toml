# The public resizer for one deployment: serves the same bucket at its own
# hostname so the library's thumbnails and copied URLs work, and reads the
# same database for the public metadata API. The REPLACE_ value is filled in
# by scripts/provision.sh. Nothing here is secret.
name = "photonrelic-example-resizer"
main = "../../workers/resizer/src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "img.example.com", custom_domain = true }]

[observability]
enabled = true

[vars]
# Must match the library's LIBRARY_PREFIXES.
SERVED_PREFIXES = "media/"
# Optional: only pages on these hosts may embed images; include the library's
# hostname. Unset, any page may embed. See workers/resizer/wrangler.toml.
# ALLOWED_ORIGINS = "www.example.com, example.com, *.example.com, media-admin.example.com"
# The library's host, whose pages may still see a file whose rights have expired (README).
# LIBRARY_HOST = "media-admin.example.com"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "photonrelic-example-media"

# The library's database (library.toml), read only, for the metadata API at
# /api/v1/assets and the 410 for a key whose rights have expired. Remove this
# block to deploy without them: the API then answers 404 `API_UNAVAILABLE`,
# every key serves, and images are unaffected.
[[d1_databases]]
binding = "DB"
database_name = "photonrelic-example"
database_id = "REPLACE_D1_DATABASE_ID"

# Without Images enabled on the account, objects are served as stored with
# `x-media-transform: unavailable`. The account must be on Workers Paid, or a
# page of fresh thumbnails dies on the Free plan's 10 ms CPU limit (README, Setup).
[images]
binding = "IMAGES"

# Every image served is counted in this Workers Analytics Engine dataset; the
# library reads it (USAGE_DATASET in library.toml must match) to show hits per
# file and the files nothing has asked for in 90 days.
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "photonrelic_usage"
