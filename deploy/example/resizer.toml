# The public resizer for one deployment: serves the same bucket at its own
# hostname so the library's thumbnails and copied URLs work. Nothing here is
# secret.
name = "photonrelic-example-resizer"
main = "../../workers/resizer/src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "img.example.com", custom_domain = true }]

[observability]
enabled = true

[vars]
# Must match the library's LIBRARY_PREFIXES.
SERVED_PREFIXES = "media/"
# Optional: only pages on these hosts may embed images; include the library's
# hostname. Unset, any page may embed. See workers/resizer/wrangler.toml.
# ALLOWED_ORIGINS = "www.example.com, example.com, *.example.com, media-admin.example.com"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "photonrelic-example-media"

# Optional: the library's database (library.toml), read only, so a key whose
# rights have expired answers 410 Gone. See workers/resizer/wrangler.toml.
# [[d1_databases]]
# binding = "DB"
# database_name = "photonrelic-example"
# database_id = "REPLACE_D1_DATABASE_ID"

# Without Images enabled on the account, objects are served as stored with
# `x-media-transform: unavailable`.
[images]
binding = "IMAGES"

# Every image served is counted in this Workers Analytics Engine dataset; the
# library reads it (USAGE_DATASET in library.toml must match) to show hits per
# file and the files nothing has asked for in 90 days.
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "photonrelic_usage"
