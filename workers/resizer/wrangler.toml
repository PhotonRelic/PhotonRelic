# The public resizer. It serves objects from the media bucket at their own
# path (media/products/chair.jpg is GET /media/products/chair.jpg) and resizes
# on request from the menu in packages/media-params. Nothing here is secret.
#
# Before deploying, set a route or custom domain for your zone below, and the
# bucket name the library Worker uses.
name = "photonrelic-resizer"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# No workers.dev address or preview URLs: serve on your own hostname.
workers_dev = false
preview_urls = false

# Either a hostname of its own...
# routes = [{ pattern = "img.example.com", custom_domain = true }]
# ...or a path on your site's hostname, matching SERVED_PREFIXES:
# routes = [{ pattern = "www.example.com/media/*", zone_name = "example.com" }]

[observability]
enabled = true

[vars]
# Comma-separated key prefixes this Worker serves; everything else is a 404.
# Keep it in step with the library's LIBRARY_PREFIXES.
SERVED_PREFIXES = "media/"
# Optional: override the resize menu. Unset keeps the defaults
# (160, 320, 480, 768, 1024, 1440, 2048 and 1:1, 4:3, 3:2, 8:5, 16:9).
# MEDIA_WIDTHS = "320,768,1440"
# MEDIA_ASPECTS = "1:1,16:9"
# Optional: only pages on these hosts may embed images, judged by the Origin
# then the Referer header; other sites get a 403. `*.example.com` matches
# subdomains only, so list the bare domain too. Include the library's own
# hostname, or its thumbnails stop loading. Unset, any page may embed.
# ALLOWED_ORIGINS = "www.example.com, example.com, *.example.com, media-admin.example.com"
# With ALLOWED_ORIGINS, requests that carry no Origin or Referer (a direct link,
# an email client, a privacy browser) are let through unless this is "false".
# Note what that means: any page can send no Referer by adding
# referrerpolicy="no-referrer" to its <img>, so with the default the allowlist
# stops casual hotlinking, not a site that wants your images. Set it to "false"
# to refuse referer-less requests, at the cost of direct links and email clients.
# ALLOW_EMPTY_REFERER = "true"
# The library's own host: its pages may still see a file whose rights have
# expired, so the person renewing or retiring it knows what it is. Those
# responses never enter the shared cache. Unset, an expired file is 410 to all.
# LIBRARY_HOST = "media-admin.example.com"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "photonrelic-media"

# Optional: the library's database, read only. With it, a key whose rights
# have expired (the file page's Expires date has passed) answers 410 Gone on
# a cache miss. Without it, expiry only retires the file in the library.
# [[d1_databases]]
# binding = "DB"
# database_name = "photonrelic"
# database_id = "00000000-0000-0000-0000-000000000000"

# Cloudflare Images: billed per unique source-and-parameters pair per month.
# Without it, objects are served as stored with `x-media-transform: unavailable`.
# The account must be on Workers Paid: a cold resize of a large original costs
# a few hundred milliseconds of CPU, and the Free plan's 10 ms per request
# kills a page of fresh thumbnails with error 1102 (see the README's Setup).
[images]
binding = "IMAGES"

# Optional: count every image served in a Workers Analytics Engine dataset,
# so the library can show how often a file is used and list files nothing
# has asked for in 90 days (the engine's retention). The library reads the
# same dataset name through USAGE_DATASET. Without the binding nothing is
# counted. Locally the points are discarded unless `remote = true`.
# [[analytics_engine_datasets]]
# binding = "USAGE"
# dataset = "photonrelic_usage"

# Optional: the library's database, read only, for the public metadata API
# (GET /api/v1/assets/<key>). Point it at the same database as the library's
# wrangler.toml; the library runs the migrations. Without it the API answers
# 404 `API_UNAVAILABLE` and images are unaffected.
# [[d1_databases]]
# binding = "DB"
# database_name = "photonrelic"
# database_id = "00000000-0000-0000-0000-000000000000"
